  state: cross-session-memory
  identity: dedicated-agent
  evidence_strength: detailed-primary
summary: An internal agent system in which natural-language seeds and end-to-end scenario
  harnesses drive agents that write, validate, and iterate on code under standing rules
  that humans neither write nor review code.
architecture:
  sandbox: unknown
  harness: End-to-end scenario harness with user-story-style scenarios kept outside the
    codebase as a holdout set and checked by an LLM; satisfaction measured as the fraction
    of observed scenario trajectories that likely satisfy the user; Digital Twin Universe
    clones of Okta, Jira, Slack, Google Docs, Google Drive, and Google Sheets absorb scenario
    load
  model: Multi-provider routing by task as of 2026-06 (gpt-5.5 for everyday and DevOps
    tasks, QA orchestration, and security review; consensus of opus-4.8 and gpt-5.5
    for sprint planning; opus-4.8 for frontend aesthetics and writing; gemini-3-flash-preview
    for image comprehension and agentic dialogues; gpt-image-2 and gpt-realtime-2 for
    UX ideation and voice)
  tool_access: Filesystem that agents read and write to self-manage context; Digital
    Twin Universe as a stand-in for third-party services
  knowledge: CXDB, a self-hosted context store for AI agents with turn DAG, blob deduplication,
    dynamic types, and visual debugging
  credentials: StrongDM ID, an identity system for humans, workloads, and AI agents
    with federated authentication and path-scoped sharing
  context_mgmt: Pyramid Summaries with reversible summarization at multiple zoom levels;
    on-disk state as the memory substrate
primitives:
- name: Scenarios
  desc: End-to-end user-story validations, often stored outside the codebase like a
    training holdout set, flexibly checked by an LLM to resist reward hacking and lazy
    test rewriting
- name: Satisfaction
  desc: Probabilistic success measure replacing boolean test-green; the fraction of
    all observed scenario trajectories that likely satisfy the user
- name: Digital Twin Universe
  desc: Behavioral clones of third-party services that replicate APIs, edge cases,
    and observable behaviors, so thousands of scenarios can run per hour without rate
    limits, abuse detection, or live-API cost
- name: Shift Work
  desc: Splitting work into interactive and fully specified classes; when specs, tests,
    and the existing app fully express intent, an agent runs end-to-end without back-and-forth
- name: Attractor
  desc: Non-interactive coding agent structured as a graph of work phases with natural-language
    edges evaluated by the LLM; execution traverses the graph until convergence or
    termination, and the spec is open source
key_metrics: []
lessons_learned:
- Treat generated code like an ML model snapshot; judge it only by externally observable
  behavior and never by semantic inspection of the source
- The seed, validation harness, and feedback loop run until the holdout scenarios pass
  and stay passing
- Tokens are the fuel; if the factory has not spent at least $1,000 on tokens per human
  engineer in a day, it has room for improvement

summary: A general-purpose 'AI colleague' spanning sales, finance, client ops, engineering, and recruitment, later
  split into a reusable toolkit plus Slack and desktop surfaces.
headline_metric: ~35 integrations organized into skills
architecture:
  harness: Claude/Anthropic SDK wrapper; a reusable tool/skill/memory layer separated from the Slack and desktop
    interfaces
  model: Claude (Anthropic SDK)
  interfaces:
  - slack
  - desktop
  tool_access: ~35 integrations organized into skills; specialist delegates per domain
  knowledge: 'Four memory layers: conversation context, persistent facts, knowledge RAG, and live system state'
  credentials: Customer-impacting actions gated behind team-visible Slack approvals
  context_mgmt: Four-layer memory separation; prompt size dropped substantially after splitting capabilities from
    the Slack layer
primitives:
- name: Four memory layers
  desc: Transient conversation, persistent facts, knowledge RAG, and live system state; kept separate
- name: Reusable toolkit split
  desc: Capabilities separated from the interface layer so they power multiple surfaces
key_metrics:
- ~35 integrations organized into skills
lessons_learned:
- Domu separated Slack handling from Clementino's tools, skills, memory, and core, then reused the toolkit
  in Claude Cowork.
- Clementino shares conversation context, persistent facts, retrieval knowledge, and live system state across
  its Slack and desktop interfaces.
- Clementino routes customer-facing actions through visible Slack approvals, including requests started from
  the desktop.

summary: OpenAI's internal incident-response agent, built on Codex. When an incident is
  detected, the bot wakes up, collects context, determines possible mitigations without
  executing any, and answers developers' questions in the incident Slack channel; an
  engineer can tell it to apply a chosen mitigation.

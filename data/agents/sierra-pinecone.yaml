summary: Pinecone is Sierra's shared agent interface for employee work. It routes requests to a model, harness,
  and environment, runs sessions on Agency, and connects to company systems through an MCP Gateway.
headline_metric: More than 75,000 sessions created by 600 people in the month preceding the report
architecture:
  sandbox: Agency layer reconciles recoverable Kubernetes runners; conversation/events/checkpoints stay durable
    separately
  harness: App server + Agency + runners; intent-based model/environment routing (Claude Code + Codex)
  model: Claude Code + Codex; a classifier routes by task intent to select repository, environment, harness, model,
    and reasoning budget
  interfaces:
  - slack
  - web
  - linear
  - mobile
  tool_access: MCP Gateway connected to 45 systems; a network proxy decides whether privileged requests proceed
    and injects credentials after approval
  knowledge: Durable sessions over disposable environments; Redis Streams
  credentials: Gateway enforces the invoking employee's access at tool-call time and isolates customer data; the
    harness never holds the real secret
  context_mgmt: Durable session state separated from ephemeral compute
primitives:
- name: MCP Gateway (45 systems)
  desc: One gateway spanning 45 systems, enforcing employee permissions at call time
- name: Agency sandbox layer
  desc: Recoverable K8s runners with a network proxy for credential injection
- name: Intent-based routing
  desc: Routes model and environment by request intent, independent of the tool layer
key_metrics:
- More than 75,000 sessions created by 600 people in the month preceding the report
- 70% of company PRs opened through Pinecone in the month preceding the report
lessons_learned:
- Pinecone presents one entry point while a classifier chooses the repository, environment, harness, and model
  for the task.
- Sierra wraps Codex and Claude Code behind a common runner protocol and can change routing defaults centrally.
- Sierra's gateway audits customer-data access and blocks sensitive access spanning multiple customers in a
  session; some CLI access uses separate read-only tokens.
- Sierra's session total measures use of Pinecone; it does not by itself measure time saved or the quality of
  completed work.

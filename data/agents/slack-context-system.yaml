summary: Slack's engineering team runs an agentic service that investigates security alerts. A Director agent orchestrates
  rounds, Expert agents gather evidence, and a Critic scores each finding for credibility. Instead of message history, three
  written channels carry the state between rounds.
headline_metric: Context management for security investigations spanning hundreds of inference requests and megabytes
  of output
architecture:
  harness: 'Coordinator/dispatcher: a central coordinator dispatches to expert agents and to critic agents'
  model: Not specified
  tool_access: Expert agents produce reports; critic agents evaluate them using evidence-inspection tools
  context_mgmt: Three channels; Director's Journal (working memory), Critic's Review (credibility-weighted findings),
    Critic's Timeline (deduped chronological synthesis)
primitives:
- name: Director's Journal
  desc: 'Structured working memory: findings, decisions, questions, hypotheses'
- name: Critic's Review
  desc: A model critiques submitted findings, inspects cited evidence, and assigns credibility scores
- name: Critic's Timeline
  desc: A model consolidates a timeline, removes duplicate events, and weighs conflicting findings between rounds
- name: Pose the round's questions
  desc: The Director decides what questions to ask and which Experts to engage; investigations run in rounds
    until the Director concludes them
- name: Gather evidence and submit findings
  desc: Experts interrogate their data sources and produce findings that cite investigation artifacts
- name: Conclude the investigation
  desc: The Director summarizes the root cause and the recommended actions, and ends the investigation
key_metrics:
- Handles multi-agent runs spanning hundreds of requests and megabytes of output
- Over 170,000 findings scored by the Critic; slightly over a quarter fell below the plausible threshold
lessons_learned:
- Slack passes a director journal, reviewed findings, and a consolidated timeline between investigation rounds
  instead of forwarding the full message history.
- Slack's Experts gather evidence; a Critic checks their findings and can inspect the original tool calls and
  results.
- Slack's context channels preserve information across investigation rounds, but the report does not establish
  recovery after a worker restart.

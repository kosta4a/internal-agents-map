    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The context article enumerates the three channels and explicitly says no other message
      history is passed forward.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The review-tools section describes both responsibilities and the Critic's access to evidence.
      The Critic is still a model and can make errors.

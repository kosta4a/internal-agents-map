claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: unverified
    confidence_reason: The source documents River-opened, River-coauthored pull requests that are later merged,
      but no passage establishes that a person reviews the work product on each run; PR review runs as a separate
      Aquifer profile and is described as often having no human in the loop.
    valid_at: '2026'
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective identifies these as existing human-development priorities made more
      urgent by agents; it does not quantify each contribution.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The article describes mining earlier runs and preserving searchable threads, replacing
      the vague claim that private agents cannot teach anyone.
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The session and lifecycle sections explicitly separate the durable log from disposable
      cells; they do not claim every external side effect is automatically recoverable.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The profile section enumerates the bundle contents and explains how a new bundle becomes
      an internal agent product.

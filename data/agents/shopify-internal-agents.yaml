- scope: River coding request → River-opened, River-coauthored pull request
  attention_boundary: unknown
rubric:
  invocation:
  - event-driven
  - interactive
  state: durable-session
  identity: unknown
  evidence_strength: detailed-primary
summary: The Aquifer agent platform (session/harness/sandbox split) powers River, a Slack-native coding agent, plus
  PR-review and headless Vanilla agent profiles; other teams have requested research, migration, and compliance-scan
  agents.
headline_metric: 1 in 8 merged PRs company-wide coauthored by River
architecture:
  sandbox: An execution environment (filesystem, shell, repo, build/test) separated from the harness; Shopify credits
    the brain-and-hands framing to Anthropic
  harness: Session (durable; Postgres append-only event log) + Harness (cheap agent loop) + Cell (ephemeral Go runtime);
    cells die, sessions persist
  model: The design lets Shopify change the model without changing the sandbox
  interfaces:
  - slack
  - github
  tool_access: Repo + tests + data warehouse + production traces + PR creation; a gateway credentials proxy
  knowledge: Monorepo 'World' (code + skills + conventions + intent docs + runbooks + AGENTS.md); Nix reproducible
    envs; Slack-transcript corpus mining
  credentials: Gateway credentials proxy; per-profile sandbox policies; Shopify SSO
  context_mgmt: Skills loaded on-demand as files, updatable per session; session survival across cell/sandbox/machine
    death
primitives:
- name: Session/Harness/Sandbox split
  desc: Durable identity, disposable loop, isolated execution; swap any layer independently
- name: River (public-by-default)
  desc: River works in shared Slack threads whose history can be searched and used to update skills
- name: Skills as files
  desc: Written-down knowledge mined from successful patterns and public transcripts
key_metrics:
- 'River: 59,918 sessions / 30 days across 5,170 Slack channels'
- 3,536 River-coauthored PRs merged; 1 in 8 merged PRs company-wide
- Median session 19 min; median 50 tool calls/session
lessons_learned:
- Shopify says its monorepo, reproducible environments, written skills, and CI improvements benefited both
  engineers and agents.
- Shopify uses shared River threads and the run corpus to update skills, prompts, and defaults for later work.
- Aquifer stores session identity and its event log in Postgres so a fresh worker can continue the same conversation.
- Shopify adds agent variants as profiles containing prompts, skills, extensions, sandbox policy, and model
  defaults on Aquifer.

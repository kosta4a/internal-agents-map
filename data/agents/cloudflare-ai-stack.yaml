summary: Cloudflare's Dev Productivity team runs an internal AI engineering stack built on the company's own products.
  It puts MCP servers behind one OAuth portal, routes every model request through a gateway, and generates
  context files across thousands of repos. Every merge request gets an automated multi-agent review.
headline_metric: 47.95 million AI requests in 30 days across the internal AI engineering system
architecture:
  sandbox: Dynamic Workers for sandboxed code execution; Sandbox SDK to clone/build/test
  harness: OpenCode + Windsurf clients; Agents SDK (McpAgent + Durable Objects) for stateful sessions
  model: Workers AI (open-weight, on-platform) + frontier models (Opus, GPT), routed by task
  interfaces:
  - cli
  - ci
  - web
  tool_access: MCP Server Portal; one OAuth point aggregating 182+ tools from 13 servers; AI Gateway for routing,
    cost, BYOK, ZDR
  knowledge: Backstage catalog (2,055 services) + AGENTS.md generated across ~3,900 repos
  credentials: Zero API keys on client machines; a Worker injects keys server-side; Cloudflare Access (Zero Trust)
    auth
  context_mgmt: Code Mode collapses upstream tool schemas into search + execute, holding token overhead constant
    at scale
primitives:
- name: MCP Server Portal
  desc: One OAuth aggregation point for all MCP tools
- name: Code Mode
  desc: Searches tool schemas through a portal and exposes a separate execution function
- name: AGENTS.md
  desc: Structured, generated repo context (runtime, nav, conventions, boundaries, deps)
- name: AI Code Reviewer
  desc: 'Multi-agent CI review: risk tiering, specialist agents, Codex-rule citations'
key_metrics:
- 3,683 internal users (60% of company, 93% of R&D)
- 47.95M AI requests and 241.37B tokens via AI Gateway in the preceding 30 days
- 10,952 merge requests in the week of March 23, 2026, nearly double the Q4 baseline; four-week average above 8,700
- 295 teams using agentic AI tools
lessons_learned:
- Cloudflare added user attribution, model discovery, and permission checks at a shared proxy without changing
  client configurations.
- Cloudflare exposes service ownership and dependencies through Backstage and writes repository conventions
  into AGENTS.md files.
- Cloudflare replaced upfront tool schemas with portal search and execution functions after measuring their
  context overhead.
- Cloudflare uses frontier models for most complex coding work and Workers AI for selected workloads, including
  documentation review and context-file generation.

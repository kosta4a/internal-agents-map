summary: Forge, started as Claudebot, turns a Slack/GitHub/Linear discussion into a Linear issue, fix, PR, and
  one-off build; Mux lets employees run many coding agents concurrently; as of February 2026, 5% of all PRs
  merged company-wide come from these background agents.
headline_metric: '5% of all PRs merged come from in-house background agents (Feb 2026)'
architecture:
  sandbox: Mux gives each concurrent agent its own git worktree, branch, and terminal
  harness: Portfolio approach; Claude Code, OpenCode, Cursor, and Copilot rather than one harness; Forge is a custom
    Slack-native harness with the same tools and context as engineers, invokable from Slack, GitHub, and Linear;
    built in-house because security requirements blocked cloud background agents
  model: Portfolio across multiple providers; the Slack agent Claude bot can use multiple underlying models despite
    its name
  interfaces:
  - slack
  - github
  - linear
  tool_access: Linear treated as the structured product context / source of truth
  knowledge: Linear as the durable structured-context layer for product work
primitives:
- name: Forge
  desc: 'Custom harness: Slack bug discussion → Linear issue → fix → PR → one-off build'
- name: Mux
  desc: Concurrency layer; one human coordinates many isolated coding agents, each in its own worktree/branch/terminal
key_metrics:
- 'Mux: 600+ users including engineers, PMs, and designers (335 active, 197 power users)'
- 5% of all PRs merged come from in-house background agents (Feb 2026)
- Wallet rewrite PR review times reduced from 150 hours to 15 hours (self-reported; period and method not documented)
- 'Speed run: about 100 participants opened about 70 PRs in 15 minutes (opened, not merged; single event)'
lessons_learned:
- Support a portfolio of harnesses (Claude Code, OpenCode, Cursor, Copilot) rather than standardizing on one
- Keep the system of record (Linear) as the agent's structured context; conversation can be the input, Linear stays
  durable
- Simple per-agent worktree/branch/terminal isolation is a pragmatic alternative to full sandboxing for concurrent
  coding
- Security requirements that blocked cloud background agents motivated the in-house, Slack-native harness build
- Give background agents the same tools and context as engineers through a Slack-native interface
- Spread adoption through visible team experiments, such as PR speed runs and shared Slack channels, rather than
  mandates

summary: >-
  Honk is Spotify's background coding agent; it runs on a Claude-Agent-SDK harness in Kubernetes, uses trusted
  CI tools, and combines formatting and linting with LLM-based diff evaluation. Xirp is a related Spotify beta
  product: an agentic development environment connected to Portal for organizational context; its relationship
  to Honk is not documented in the captured sources.
headline_metric: 1,500+ merged pull requests generated by Honk
architecture:
  sandbox: Honk runs in Kubernetes pods; Fleet Management runs transformation jobs in containers
  harness: 'Honk: Claude Agent SDK + Spotify''s own harness + Kubernetes pods; Honk v2 adds shared sessions, projects,
    and Chirp orchestration'
  model: Claude via the Agent SDK; the earlier migration CLI supported switching agents and LLMs
  interfaces:
  - slack
  - github
  - cli
  tool_access: Trusted CI tools verify changes, while an internal CLI runs formatting
    and linting through MCP and evaluates diffs with an LLM judge
  knowledge: Backstage exposes component ownership and documentation through MCP and command-line tools
  context_mgmt: Fleet Management coordinates repo targeting, builds/tests, and PR workflow at scale; Xirp pairs
    sessions with Portal org context
primitives:
- name: Deterministic and model-based verification
  desc: The harness combines build/test tools, formatting and linting, and LLM-based diff evaluation
- name: Fleet management
  desc: Target thousands of repos, run builds/tests, open and merge PRs at fleet scale
- name: Xirp (workspace/context layer)
  desc: An agentic development environment connected to Portal for organizational context; its relationship to
    Honk is not documented in the captured sources
key_metrics:
- 1,500+ merged AI-generated PRs (Honk)
- 60-90% time savings on migrations vs manual
- Around half of Spotify PRs automated by Fleet Management since mid-2024, including deterministic transformations
lessons_learned:
- Spotify's coding CLI combines formatting and linting with a separate model-based assessment of the diff.
- Honk runs in Kubernetes pods and uses trusted tools, including builds in Spotify's CI environment.
- Spotify exposes Backstage ownership and documentation through tools and gives agents feedback through its
  existing lint standards.
- Spotify describes Xirp as supplying service ownership, documentation, and architecture context to coding
  sessions.
